- id: duplicate-variants
  category: duplicates
  vars:
    roll: {id: "R"}
  let:
    - d: "{{day -8}}"
    - d2: "{{day -9}}"
  steps:
    - entry: feedback
      body: {roll_number: "{{.roll}}", meal: Lunch, rating: 4, date: "{{.d}}"}
      expect:
        json: [{path: status, equals: accepted}]
    - entry: feedback
      body: {roll_number: "  {{lower .roll}} ", meal: lunch, rating: 2, date: "{{.d}}"}
      expect:
        json: [{path: status, equals: duplicate}]
    - entry: feedback
      body: {roll_number: "{{.roll}}", meal: Dinner, rating: 2, date: "{{.d}}"}
      expect:
        json: [{path: status, equals: accepted}]
    - entry: feedback
      body: {roll_number: "{{.roll}}", meal: Lunch, rating: 5, date: "{{.d2}}"}
      expect:
        json: [{path: status, equals: accepted}]
    - entry: report
      body: {date: "{{.d}}"}
      expect:
        json:
          - {path: total_responses, equals: 2}
          - {path: "meals[1].responses", equals: 1}
          - {path: "meals[1].average_rating", equals: 4}
    - entry: report
      body: {date: "{{.d2}}"}
  expect:
    json:
      - {path: total_responses, equals: 1}
      - {path: overall_rating, equals: 5}

- id: report-maths
  category: report maths
  vars:
    b1: {int: [1, 2]}
    b2: {int: [1, 2]}
    l1: {int: [3, 5]}
    l2: {int: [3, 5]}
    l3: {int: [3, 5]}
    n1: {int: [1, 5]}
    n2: {int: [1, 5]}
    roll: {id: "R"}
  let:
    - d: "{{day -10}}"
    - bAvg: "{{round (div (add .b1 .b2) 2)}}"
    - lAvg: "{{round (div (add .l1 (add .l2 .l3)) 3)}}"
    - nAvg: "{{round (div (add .n1 .n2) 2)}}"
    - overall: "{{round (div (add (add .b1 .b2) (add (add .l1 (add .l2 .l3)) (add .n1 .n2))) 7)}}"
  steps:
    - {entry: feedback, body: {roll_number: "{{.roll}}A", meal: Breakfast, rating: "{{.b1}}", date: "{{.d}}"}}
    - {entry: feedback, body: {roll_number: "{{.roll}}B", meal: Breakfast, rating: "{{.b2}}", date: "{{.d}}"}}
    - {entry: feedback, body: {roll_number: "{{.roll}}C", meal: Lunch, rating: "{{.l1}}", date: "{{.d}}"}}
    - {entry: feedback, body: {roll_number: "{{.roll}}D", meal: Lunch, rating: "{{.l2}}", date: "{{.d}}"}}
    - {entry: feedback, body: {roll_number: "{{.roll}}E", meal: Lunch, rating: "{{.l3}}", date: "{{.d}}"}}
    - {entry: feedback, body: {roll_number: "{{.roll}}F", meal: Dinner, rating: "{{.n1}}", date: "{{.d}}"}}
    - {entry: feedback, body: {roll_number: "{{.roll}}G", meal: Dinner, rating: "{{.n2}}", date: "{{.d}}"}}
    - entry: report
      body: {date: "{{.d}}"}
  expect:
    json:
      - {path: total_responses, equals: 7}
      - {path: overall_rating, equals: "{{.overall}}"}
      - {path: "meals[0].responses", equals: 2}
      - {path: "meals[0].average_rating", equals: "{{.bAvg}}"}
      - {path: "meals[1].responses", equals: 3}
      - {path: "meals[1].average_rating", equals: "{{.lAvg}}"}
      - {path: "meals[2].responses", equals: 0}
      - {path: "meals[2].average_rating", type: "null"}
      - {path: "meals[3].responses", equals: 2}
      - {path: "meals[3].average_rating", equals: "{{.nAvg}}"}
      - {path: meals_requiring_attention, contains: Breakfast}
      - {path: meals_requiring_attention, not_contains: Lunch}
      - {path: meals_requiring_attention, not_contains: Snacks}

- id: attention-boundary
  category: report maths
