    - {entry: feedback, body: {roll_number: "{{.roll}}B", meal: Lunch, rating: 3, date: "{{.d}}"}}
    - {entry: feedback, body: {roll_number: "{{.roll}}C", meal: Dinner, rating: 2, date: "{{.d}}"}}
    - {entry: feedback, body: {roll_number: "{{.roll}}D", meal: Dinner, rating: 2, date: "{{.d}}"}}
    - {entry: feedback, body: {roll_number: "{{.roll}}E", meal: Dinner, rating: 3, date: "{{.d}}"}}
    - entry: report
      body: {date: "{{.d}}"}
  expect:
    json:
      - {path: "meals[1].average_rating", equals: 2.5}
