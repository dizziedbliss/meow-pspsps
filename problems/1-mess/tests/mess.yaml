# Tests call the two webhooks and read the JSON replies; storage is not prescribed (the report proves it).
# Every test uses its own date offset and roll numbers.

- id: sample-accept-and-report
  category: records feedback
  visible: true
  vars:
    roll: {id: "R"}
    r: {int: [1, 5]}
  let:
    - d: "{{day -1}}"
  steps:
    - entry: feedback
      body: {roll_number: "{{.roll}}", meal: Dinner, rating: "{{.r}}", date: "{{.d}}"}
      expect:
        json:
          - {path: status, equals: accepted}
          - {path: message, type: string}
    - entry: report
      body: {date: "{{.d}}"}
  expect:
    json:
      - {path: date, equals: "{{.d}}"}
      - {path: total_responses, equals: 1}
      - {path: overall_rating, equals: "{{.r}}"}
      - {path: meals, len: 4}
      - {path: "meals[3].meal", equals: Dinner}
      - {path: "meals[3].responses", equals: 1}
      - {path: "meals[3].average_rating", equals: "{{.r}}"}
      - {path: "meals[0].average_rating", type: "null"}

- id: sample-duplicate
  category: duplicates
  visible: true
  vars:
    roll: {id: "R"}
  let:
    - d: "{{day -2}}"
  steps:
    - entry: feedback
      body: {roll_number: "{{.roll}}", meal: Lunch, rating: 4, comment: "Good food", date: "{{.d}}"}
      expect:
        json: [{path: status, equals: accepted}]
    - entry: feedback
      body: {roll_number: "{{.roll}}", meal: Lunch, rating: 1, date: "{{.d}}"}
      expect:
        json: [{path: status, equals: duplicate}]
    - entry: report
      body: {date: "{{.d}}"}
  expect:
    json:
      - {path: total_responses, equals: 1}
      - {path: overall_rating, equals: 4}

- id: missing-roll
  category: validation
  vars:
    roll: {pick: ["", "   "]}
  let:
    - d: "{{day -3}}"
  steps:
    - entry: feedback
      body: {roll_number: "{{.roll}}", meal: Lunch, rating: 3, date: "{{.d}}"}
      expect:
        json: [{path: status, equals: rejected}, {path: message, type: string}]
    - entry: feedback
      body: {meal: Snacks, rating: 3, date: "{{.d}}"}
      expect:
        json: [{path: status, equals: rejected}]
    - entry: report
      body: {date: "{{.d}}"}
  expect:
    json:
      - {path: total_responses, equals: 0}
      - {path: overall_rating, type: "null"}

- id: bad-rating
  category: validation
  vars:
    roll: {id: "R"}
    bad: {pick: [0, 6, 3.5, "abc", -2, 11]}
  let:
    - d: "{{day -4}}"
  steps:
    - entry: feedback
      body: {roll_number: "{{.roll}}", meal: Breakfast, rating: "{{.bad}}", date: "{{.d}}"}
      expect:
        json: [{path: status, equals: rejected}]
    - entry: feedback
      body: {roll_number: "{{.roll}}", meal: Breakfast, date: "{{.d}}"}
      expect:
        json: [{path: status, equals: rejected}]
    - entry: report
      body: {date: "{{.d}}"}
  expect:
    json:
      - {path: total_responses, equals: 0}

