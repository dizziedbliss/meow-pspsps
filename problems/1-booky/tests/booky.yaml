# Tests observe customer replies and calendar state; workflow structure is not prescribed.
- id: sample-book-free-day
  category: books a free day
  visible: true
  vars:
    off:
      int:
      - 4
      - 18
    name:
      name: true
  steps:
  - chat: a
    from: '{{.name}}'
    message: Hey! Can I book an appointment on {{pretty .off}}?
  expect:
    json:
    - path: reply_count
      equals: 1
    - path: calendar.created
      len: 1
    - path: calendar.created[0].date
      equals: '{{day .off}}'
    - path: calendar.created[0].summary
      iequals: Appointment - {{.name}}
    rubric: The reply confirms the booking for {{pretty .off}}. Accept any clear date format or unambiguous wording
      referring to the requested date. The reply must be customer-facing plain text, not JSON or Markdown, with
      no discussion of internal tools or steps.
    rubric_field: reply
- id: sample-no-date
  category: asks for a date
  visible: true
  vars:
    name:
      name: true
  steps:
  - chat: a
    from: '{{.name}}'
    message: Hi there, I'd like to book an appointment please
  expect:
    json:
    - path: reply_count
      equals: 1
    - path: calendar.created
      len: 0
    rubric: The reply asks the customer which date they would like. It must not claim that anything was booked.
      The reply must be customer-facing plain text, not JSON or Markdown, with no discussion of internal tools or
      steps.
    rubric_field: reply
- id: refuses-today
  category: refuses same-day
  vars:
    name:
      name: true
  steps:
  - chat: a
    from: '{{.name}}'
    message: Can you squeeze me in today?
  expect:
    json:
    - path: calendar.created
      len: 0
    - path: reply_count
      equals: 1
    rubric: The reply says same-day bookings (today) aren't possible and asks for a different day. Nothing is booked.
      The reply must be customer-facing plain text, not JSON or Markdown, with no discussion of internal tools or
      steps.
    rubric_field: reply
- id: refuses-past
  category: refuses past dates
  vars:
    back:
      int:
      - 3
      - 40
    name:
      name: true
  steps:
  - chat: a
    from: '{{.name}}'
    message: Please book me for {{pretty (sub 0 .back)}}
  expect:
    json:
    - path: reply_count
      equals: 1
    - path: calendar.created
      len: 0
    rubric: The reply says that date is in the past (or can't be booked because it already happened) and asks for
      a future date. Nothing is booked. The reply must be customer-facing plain text, not JSON or Markdown, with
      no discussion of internal tools or steps.
    rubric_field: reply
- id: busy-day
  category: day already booked
  vars:
    off:
      int:
      - 3
      - 15
    name:
      name: true
  calendar:
  - summary: Appointment - Priya
    start: '{{day .off}}T10:00:00'
    end: '{{day .off}}T11:00:00'
  steps:
  - chat: a
    from: '{{.name}}'
    message: I want an appointment on {{pretty .off}}
  expect:
    json:
    - path: reply_count
      equals: 1
    - path: calendar.created
      len: 0
    - path: calendar.events
      len: 1
    rubric: The reply says that day is not available (already booked) and asks the customer to choose another day.
      It does not confirm a booking. The reply must be customer-facing plain text, not JSON or Markdown, with no
      discussion of internal tools or steps.
    rubric_field: reply
- id: holiday
  category: holiday on that day
  vars:
